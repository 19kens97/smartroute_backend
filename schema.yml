        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: procedure_status
        schema:
          type: string
          enum:
          - ACTION_TAKEN
          - CANCELLED
          - CLOSED
          - OPEN
          - REFERRED
        description: |-
          * `OPEN` - Ouvert
          * `ACTION_TAKEN` - Mesure prise
          * `REFERRED` - Transmis
          * `CLOSED` - Clôturé
          * `CANCELLED` - Annulé
      - in: query
        name: qualification_status
        schema:
          type: string
          enum:
          - CONFIRMED
          - POTENTIAL
          - REJECTED
          - UNDER_REVIEW
        description: |-
          * `POTENTIAL` - Potentiel
          * `UNDER_REVIEW` - En révision
          * `CONFIRMED` - Confirmé
          * `REJECTED` - Rejeté
      - in: query
        name: scan
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: source_type
        schema:
          type: string
          enum:
          - ALERT
          - DRIVER_SEARCH
          - LICENSE_SEARCH
          - MANUAL_OBSERVATION
          - PLATE_SCAN
          - TICKET
          - VEHICLE_CONTROL
          - VERBALIZATION
        description: |-
          * `MANUAL_OBSERVATION` - Observation directe
          * `PLATE_SCAN` - Scan ou recherche de plaque
          * `DRIVER_SEARCH` - Recherche conducteur
          * `LICENSE_SEARCH` - Recherche permis
          * `VEHICLE_CONTROL` - Contrôle véhicule
          * `TICKET` - Procès-verbal
          * `VERBALIZATION` - Verbalisation
          * `ALERT` - Alerte
      - in: query
        name: ticket
        schema:
          type: integer
      - in: query
        name: vehicle
        schema:
          type: integer
      - in: query
        name: verbalization
        schema:
          type: integer
      tags:
      - delits
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDelitCaseList'
          description: ''
    post:
      operationId: delits_create
      tags:
      - delits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelitCase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DelitCase'
          application/x-www-form-urlencoded:
