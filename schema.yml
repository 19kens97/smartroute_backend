openapi: 3.0.3
info:
  title: SmartRoute API
  version: 1.0.0
  description: Backend Django/DRF SmartRoute
paths:
  /api/alerts/:
    get:
      operationId: alerts_list
      parameters:
      - in: query
        name: alert_type
        schema:
          type: array
          items:
            type: string
            enum:
            - DOCUMENT_EXPIRY_WARNING
            - FIELD_ESCAPE
            - JUDICIAL_ALERT
            - REFUSED_CONTROL
            - STOLEN_PLATE
            - SUSPICIOUS_BEHAVIOR
            - WANTED_VEHICLE
        description: |-
          * `FIELD_ESCAPE` - Fuite lors du contrôle
          * `REFUSED_CONTROL` - Refus de contrôle
          * `SUSPICIOUS_BEHAVIOR` - Comportement suspect
          * `WANTED_VEHICLE` - Véhicule volé ou recherché
          * `STOLEN_PLATE` - Plaque volée
          * `JUDICIAL_ALERT` - Alerte judiciaire
          * `DOCUMENT_EXPIRY_WARNING` - Document proche de l'expiration
        explode: true
        style: form
      - in: query
        name: category
        schema:
          type: array
          items:
            type: string
            enum:
            - ADMINISTRATIVE
            - AUTOMATIC
            - FIELD_REPORT
        description: |-
          * `AUTOMATIC` - Automatique
          * `FIELD_REPORT` - Signalement terrain
          * `ADMINISTRATIVE` - Administrative
        explode: true
        style: form
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: created_by
        schema:
          type: integer
      - in: query
        name: expires_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: plate_number
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: array
          items:
            type: string
            enum:
            - CRITICAL
            - INFO
            - WARNING
        description: |-
          * `INFO` - Information
          * `WARNING` - Avertissement
          * `CRITICAL` - Critique
        explode: true
        style: form
      - in: query
        name: source
        schema:
          type: array
          items:
            type: string
            enum:
            - MANUAL
            - SYSTEM
        description: |-
          * `MANUAL` - Manuelle
          * `SYSTEM` - Système
        explode: true
        style: form
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - CANCELLED
            - EXPIRED
            - RESOLVED
        description: |-
          * `ACTIVE` - Active
          * `RESOLVED` - Résolue
          * `CANCELLED` - Annulée
          * `EXPIRED` - Expirée
        explode: true
        style: form
      tags:
      - alerts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertListList'
          description: ''
    post:
      operationId: alerts_create
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Alert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Alert'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/alerts/{id}/:
    get:
      operationId: alerts_retrieve
      parameters:
