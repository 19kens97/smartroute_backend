  /api/tickets/:
    get:
      operationId: tickets_list
      parameters:
      - in: query
        name: client_uuid
        schema:
          type: string
          format: uuid
      - in: query
        name: driver
        schema:
          type: integer
      - in: query
        name: opened_by
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: pricing_status
        schema:
          type: string
          enum:
          - AVAILABLE
          - FAILED
          - NOT_REQUESTED
          - PENDING
        description: |-
          * `NOT_REQUESTED` - Non demandé
          * `PENDING` - Demande en cours
          * `AVAILABLE` - Disponible
          * `FAILED` - Échec
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - CLOSED
          - OPEN
        description: |-
          * `OPEN` - En cours
          * `CLOSED` - Clôturé
          * `CANCELLED` - Annulé
      - in: query
        name: sync_status
        schema:
          type: string
          enum:
          - FAILED
          - PENDING
          - SYNCED
        description: |-
          * `PENDING` - En attente
          * `SYNCED` - Synchronisé
          * `FAILED` - Échec
      tags:
      - tickets
      security:
