components:
  schemas:
    AccountTypeEnum:
      enum:
      - PROFESSIONAL
      - PERSONAL
      type: string
      description: |-
        * `PROFESSIONAL` - Professionnel
        * `PERSONAL` - Personnel
    ActionTypeEnum:
      enum:
      - IDENTITY_CHECK
      - LICENSE_RETAINED
      - DOCUMENT_SEIZED
      - VEHICLE_IMMOBILIZED
      - VEHICLE_TOWED
      - PERSON_INTERCEPTED
      - PERSON_ARRESTED
      - REFERRED_TO_AUTHORITY
      - DOCUMENT_RETURNED
      - VEHICLE_RELEASED
      - PERSON_RELEASED
      - OTHER
      type: string
      description: |-
        * `IDENTITY_CHECK` - Contrôle d’identité
        * `LICENSE_RETAINED` - Permis retenu
        * `DOCUMENT_SEIZED` - Document saisi
        * `VEHICLE_IMMOBILIZED` - Véhicule immobilisé
        * `VEHICLE_TOWED` - Véhicule remorqué
        * `PERSON_INTERCEPTED` - Personne interceptée
        * `PERSON_ARRESTED` - Personne arrêtée
        * `REFERRED_TO_AUTHORITY` - Transmis à une autorité
        * `DOCUMENT_RETURNED` - Document restitué
        * `VEHICLE_RELEASED` - Véhicule libéré
        * `PERSON_RELEASED` - Personne libérée
        * `OTHER` - Autre
    AgentProfileRead:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        role_label:
          type: string
          readOnly: true
        badge_number:
          type: string
          maxLength: 40
        post:
          type: string
          maxLength: 120
        precinct:
          type: string
          maxLength: 120
        signature_updated_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
      required:
      - badge_number
      - role
      - role_label
    AgentProfileWrite:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        badge_number:
          type: string
          maxLength: 40
        post:
          type: string
          maxLength: 120
        precinct:
          type: string
          maxLength: 120
        is_active:
          type: boolean
      required:
      - badge_number
      - role
    AgentReport:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        email:
          type: string
          format: email
        badge_number:
          type: string
        role:
          type: string
        tickets_opened:
          type: integer
        verbalizations_created:
          type: integer
        proofs_added:
          type: integer
        delit_cases_created:
          type: integer
        delit_actions_recorded:
          type: integer
      required:
      - badge_number
      - delit_actions_recorded
      - delit_cases_created
      - email
      - full_name
      - proofs_added
      - role
      - tickets_opened
      - user_id
      - verbalizations_created
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/AlertCategoryEnum'
          readOnly: true
        category_display:
          type: string
          readOnly: true
        alert_type:
          $ref: '#/components/schemas/AlertTypeEnum'
        alert_type_display:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        vehicle:
          type: integer
          nullable: true
        plate_number:
          type: string
          maxLength: 20
        description:
          type: string
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_name:
          type: string
          nullable: true
          readOnly: true
        created_by_role:
          type: string
          nullable: true
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        subject_person:
          type: integer
          readOnly: true
          nullable: true
        subject_nif:
          type: string
          readOnly: true
        system_reasons:
          readOnly: true
        control_period_start:
          type: string
          format: date
          readOnly: true
          nullable: true
        control_period_end:
          type: string
          format: date
          readOnly: true
          nullable: true
        document_expires_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
        resolution_note:
          type: string
          readOnly: true
        is_opened:
          type: boolean
          readOnly: true
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvidence'
          readOnly: true
        evidence_type:
          allOf:
          - $ref: '#/components/schemas/AlertEvidenceTypeEnum'
          writeOnly: true
        evidence_file:
          type: string
          format: uri
          writeOnly: true
        evidence_duration_seconds:
          type: integer
          minimum: 0
          writeOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_type
      - alert_type_display
      - category
      - category_display
      - control_period_end
      - control_period_start
      - created_at
      - created_by
      - created_by_name
      - created_by_role
      - document_expires_on
      - evidence
      - expires_at
      - id
      - is_opened
      - resolution_note
      - resolved_at
      - resolved_by
      - severity
      - source
      - status
      - status_display
      - subject_nif
      - subject_person
      - system_reasons
      - updated_at
    AlertCategoryEnum:
      enum:
      - AUTOMATIC
      - FIELD_REPORT
      - ADMINISTRATIVE
      type: string
      description: |-
        * `AUTOMATIC` - Automatique
        * `FIELD_REPORT` - Signalement terrain
        * `ADMINISTRATIVE` - Administrative
    AlertClose:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
      required:
      - note
    AlertEvidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        evidence_type:
          allOf:
          - $ref: '#/components/schemas/AlertEvidenceTypeEnum'
          readOnly: true
        mime_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
        checksum_sha256:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checksum_sha256
      - created_at
      - duration_seconds
      - evidence_type
      - id
      - mime_type
      - size_bytes
      - url
    AlertEvidenceTypeEnum:
      enum:
      - AUDIO
      - VIDEO
      type: string
      description: |-
        * `AUDIO` - Audio
        * `VIDEO` - Vidéo
    AlertList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/AlertCategoryEnum'
          readOnly: true
        category_display:
          type: string
          readOnly: true
        alert_type:
          allOf:
          - $ref: '#/components/schemas/AlertTypeEnum'
          readOnly: true
        alert_type_display:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AlertStatusEnum'
          readOnly: true
        plate_number:
          type: string
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        is_opened:
          type: boolean
          readOnly: true
        document_expires_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alert_type
      - alert_type_display
      - category
      - category_display
      - created_at
      - document_expires_on
      - expires_at
      - id
      - is_opened
      - plate_number
      - severity
      - source
      - status
    AlertStatusEnum:
      enum:
      - ACTIVE
      - RESOLVED
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `RESOLVED` - Résolue
        * `CANCELLED` - Annulée
        * `EXPIRED` - Expirée
    AlertTypeEnum:
      enum:
      - FIELD_ESCAPE
      - REFUSED_CONTROL
      - SUSPICIOUS_BEHAVIOR
      - WANTED_VEHICLE
      - STOLEN_PLATE
      - JUDICIAL_ALERT
      - DOCUMENT_EXPIRY_WARNING
      type: string
      description: |-
        * `FIELD_ESCAPE` - Fuite lors du contrôle
        * `REFUSED_CONTROL` - Refus de contrôle
        * `SUSPICIOUS_BEHAVIOR` - Comportement suspect
        * `WANTED_VEHICLE` - Véhicule volé ou recherché
        * `STOLEN_PLATE` - Plaque volée
        * `JUDICIAL_ALERT` - Alerte judiciaire
        * `DOCUMENT_EXPIRY_WARNING` - Document proche de l'expiration
    ApiEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        errors: {}
      required:
      - data
      - errors
      - message
      - success
    AuthEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/AuthTokens'
        errors: {}
      required:
      - data
      - errors
      - message
      - success
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        account_type:
          type: string
        role:
